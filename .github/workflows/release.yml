# Publishes the starpod package to npm via OIDC trusted publishing — no
# token secret needed. One-time setup on npmjs.com (package settings →
# Trusted Publisher): GitHub Actions, owner shipshapecode, repository
# starpod, workflow release.yml. Provenance is generated automatically for
# trusted-publisher releases.
#
# Trigger by pushing a tag like `starpod@0.1.0` (matching the version in
# packages/starpod/package.json), or manually from the Actions tab.
name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'starpod@*'

permissions:
  contents: read
  # Required for the OIDC token exchange with npm.
  id-token: write

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Lint and unit tests
        run: |
          pnpm lint
          pnpm test:unit run
      # Node 22 bundles npm 10.x; OIDC trusted publishing needs npm 11.5.1+.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Publish starpod
        working-directory: packages/starpod
        run: npm publish --access public
